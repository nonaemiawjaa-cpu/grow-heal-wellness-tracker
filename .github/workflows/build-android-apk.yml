name: Build Grow and Heal APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Download verified source
        run: |
          curl --fail --location --output source.zip \
            https://grow-heal-wellness-tracker.nonaemiawjaa.chatgpt.site/grow-heal-android-source.zip
          curl --fail --location https://grow-heal-wellness-tracker.nonaemiawjaa.chatgpt.site/grow-heal-android-source.sha256 | sha256sum --check

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install and validate
        working-directory: wellness-tracker
        run: npm ci && npm run lint && npm test

      - name: Prepare Android app
        working-directory: wellness-tracker
        run: npm run android:sync

      - name: Build APK
        working-directory: wellness-tracker/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: grow-heal-android
          path: wellness-tracker/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
